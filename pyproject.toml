[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "niice"
version = "0.1.0"
description = "NiiCE - NIfTI Context Extension: right-click tools for quick neuroimaging tasks"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Tommaso Pavan" }]
dependencies = [
    "numpy>=1.21",
    "nibabel>=4.0",
    "scipy>=1.7",
    "matplotlib>=3.5",
    "imageio>=2.20",
    "pillow>=9.0",
    "PySide6>=6.4",
]

[project.optional-dependencies]
test = ["pytest>=7"]
# Skull stripping without containers. Installs PyTorch; for a much smaller CPU-only build run
#   pip install torch --index-url https://download.pytorch.org/whl/cpu   first.
synthstrip = ["nipreps-synthstrip>=0.0.1", "torch>=1.10.2"]

[project.scripts]
niice = "niice.cli:main"

[project.gui-scripts]
niice-gui = "niice.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
niice = ["templates/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
